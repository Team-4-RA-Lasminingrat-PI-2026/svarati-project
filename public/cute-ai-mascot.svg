<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="Cute AI Assistant Mascot">
  <defs>
    <!-- Soft background aura -->
    <radialGradient id="coralAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#E07A5F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#E07A5F" stop-opacity="0" />
    </radialGradient>

    <!-- Main robot shell gradient -->
    <linearGradient id="bodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Shell depth / bottom ambient shadow -->
    <linearGradient id="shellShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.6" />
    </linearGradient>

    <!-- Head top specular highlight -->
    <linearGradient id="topHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Visor screen background -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Visor curved glass reflection -->
    <linearGradient id="visorGloss" x1="30%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Signature Soft Coral gradient for accents -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F48E75" />
      <stop offset="100%" stop-color="#E07A5F" />
    </linearGradient>

    <!-- Coral ear cap inner ring -->
    <linearGradient id="earInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9E87" />
      <stop offset="100%" stop-color="#D9684C" />
    </linearGradient>

    <!-- LED eyes glowing gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9C85" />
      <stop offset="50%" stop-color="#FFD6CD" />
      <stop offset="100%" stop-color="#FF9C85" />
    </linearGradient>

    <!-- Antenna stem gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Headset boom arm gradient -->
    <linearGradient id="micArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>

    <filter id="coralGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="auraBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- Subtle CSS Animation -->
    <style>
      @keyframes mascotFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes eyeGlowPulse {
        0%, 100% {
          filter: drop-shadow(0 0 2px rgba(244, 142, 117, 0.6));
          opacity: 0.95;
        }
        50% {
          filter: drop-shadow(0 0 6px rgba(255, 156, 133, 1));
          opacity: 1;
        }
      }
      #mascot-avatar {
        animation: mascotFloat 4s ease-in-out infinite;
        transform-origin: 100px 105px;
      }
      #eyes {
        animation: eyeGlowPulse 2.8s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        #mascot-avatar, #eyes {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Ambient Glow Behind Mascot -->
  <g id="glow">
    <circle cx="100" cy="100" r="74" fill="url(#coralAura)" filter="url(#auraBlur)" />
  </g>

  <!-- Mascot Main Group (Floating) -->
  <g id="mascot-avatar">

    <!-- Petite Floating Chibi Torso -->
    <g id="body" filter="url(#softDropShadow)">
      <!-- Torso Base -->
      <path d="M 76 132 C 74 130 126 130 124 132 C 127 155 117 169 100 169 C 83 169 73 155 76 132 Z" fill="url(#bodyGrad)" />
      <!-- Torso Shading Curve -->
      <path d="M 76 132 C 74 130 126 130 124 132 C 127 155 117 169 100 169 C 83 169 73 155 76 132 Z" fill="url(#shellShadow)" />
      <!-- Neck seam accent -->
      <path d="M 88 135 Q 100 138 112 135" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none" />
      
      <!-- Chest Emblem: glowing mini chat bubble spark -->
      <g id="chest-emblem">
        <circle cx="100" cy="148" r="8" fill="#F1F5F9" />
        <!-- Mini chat heart/spark badge -->
        <path d="M 97 146.5 C 97 144.5 98.3 143 100 143 C 101.7 143 103 144.5 103 146.5 C 103 148 101.8 149.3 100.8 150 L 101.2 152.2 L 99.4 151 C 97.9 150.8 97 149.5 97 146.5 Z" fill="url(#coralGrad)" filter="url(#coralGlow)" />
      </g>
    </g>

    <!-- Antenna Stem & Beacon -->
    <g id="antenna">
      <rect x="97.5" y="31" width="5" height="18" rx="2.5" fill="url(#stemGrad)" />
      <!-- Tiny socket joint -->
      <ellipse cx="100" cy="48" rx="7" ry="2.5" fill="#CBD5E1" />
      <!-- Coral glowing orb -->
      <circle cx="100" cy="28" r="7.5" fill="url(#coralGrad)" filter="url(#coralGlow)" />
      <circle cx="100" cy="28" r="5" fill="#FF9C85" opacity="0.6" />
      <!-- Gloss speck -->
      <circle cx="98" cy="26" r="2" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Head Shell & Base -->
    <g id="head" filter="url(#softDropShadow)">
      <!-- Main Head Shape: Ultra-rounded friendly pebble squircle -->
      <rect x="44" y="46" width="112" height="92" rx="44" fill="url(#bodyGrad)" />
      
      <!-- Head Depth Bottom Shading -->
      <rect x="44" y="46" width="112" height="92" rx="44" fill="url(#shellShadow)" />

      <!-- Head Top Specular Glow (Ceramic/matte plastic sheen) -->
      <path d="M 56 58 C 70 50 130 50 144 58 C 130 53 70 53 56 58 Z" fill="url(#topHighlight)" />
    </g>

    <!-- Ear Caps / Headset Pods -->
    <g id="ears">
      <!-- Left Ear Cap Outer White Mount -->
      <rect x="36" y="74" width="15" height="36" rx="7.5" fill="url(#bodyGrad)" filter="url(#softDropShadow)" />
      <rect x="36" y="74" width="15" height="36" rx="7.5" fill="url(#shellShadow)" />
      <!-- Left Ear Coral Core Light -->
      <rect x="39" y="81" width="8" height="22" rx="4" fill="url(#earInnerGrad)" filter="url(#coralGlow)" />
      <!-- Left Ear Accent Ring -->
      <circle cx="43" cy="92" r="2.5" fill="#FFE2DC" />

      <!-- Right Ear Cap Outer White Mount -->
      <rect x="149" y="74" width="15" height="36" rx="7.5" fill="url(#bodyGrad)" filter="url(#softDropShadow)" />
      <rect x="149" y="74" width="15" height="36" rx="7.5" fill="url(#shellShadow)" />
      <!-- Right Ear Coral Core Light -->
      <rect x="153" y="81" width="8" height="22" rx="4" fill="url(#earInnerGrad)" filter="url(#coralGlow)" />
      <!-- Right Ear Accent Ring -->
      <circle cx="157" cy="92" r="2.5" fill="#FFE2DC" />

      <!-- Headset Microphone Boom Arm (Chat Accent) -->
      <path d="M 44 98 C 41 117 56 123 69 122" fill="none" stroke="url(#micArmGrad)" stroke-width="2.6" stroke-linecap="round" />
      <!-- Coral Microphone Capsule -->
      <rect x="68" y="118.5" width="7" height="7" rx="3.5" fill="url(#coralGrad)" filter="url(#coralGlow)" />
    </g>

    <!-- Sleek Face Visor -->
    <g id="visor">
      <!-- Visor Recessed Frame / Subtle Shadow -->
      <rect x="56" y="63" width="88" height="58" rx="26" fill="#090D16" opacity="0.3" />
      
      <!-- Visor Main Dark Screen -->
      <rect x="57" y="64" width="86" height="56" rx="25" fill="url(#visorGrad)" />
      
      <!-- Visor Subtle Inner Border Rim -->
      <rect x="57" y="64" width="86" height="56" rx="25" fill="none" stroke="#E07A5F" stroke-opacity="0.25" stroke-width="1.2" />

      <!-- Curved Gloss Reflection across top of glass -->
      <path d="M 67 71 C 76 67 124 67 133 71 C 127 77 120 78 100 78 C 80 78 73 77 67 71 Z" fill="url(#visorGloss)" />

      <!-- Soft Coral Empathic Blush on Visor -->
      <ellipse cx="71" cy="101" rx="5.5" ry="2.5" fill="#E07A5F" opacity="0.32" />
      <ellipse cx="129" cy="101" rx="5.5" ry="2.5" fill="#E07A5F" opacity="0.32" />
    </g>

    <!-- Expressive Happy LED Eyes (Smiling Inverted Arcs) -->
    <g id="eyes" filter="url(#coralGlow)">
      <!-- Left Smiling Eye Arc -->
      <path d="M 73 94 Q 82.5 82.5 92 94" fill="none" stroke="url(#eyeGrad)" stroke-width="4.8" stroke-linecap="round" />
      <!-- Left Eye Sparkle Accent -->
      <circle cx="82.5" cy="85" r="1.4" fill="#FFFFFF" opacity="0.9" />

      <!-- Right Smiling Eye Arc -->
      <path d="M 108 94 Q 117.5 82.5 127 94" fill="none" stroke="url(#eyeGrad)" stroke-width="4.8" stroke-linecap="round" />
      <!-- Right Eye Sparkle Accent -->
      <circle cx="117.5" cy="85" r="1.4" fill="#FFFFFF" opacity="0.9" />
    </g>

  </g>
</svg>