<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <title>Floating AI Robot Assistant Mascot</title>
  <style>
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes shadow { 0%, 100% { transform: scale(1); opacity: 0.45; } 50% { transform: scale(0.88); opacity: 0.25; } }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-6deg); } 50% { transform: rotate(4deg); } 75% { transform: rotate(-5deg); } }
    .mascot-float { animation: float 3.6s ease-in-out infinite; }
    .mascot-shadow { transform-origin: center; transform-box: fill-box; animation: shadow 3.6s ease-in-out infinite; }
    .mascot-wave { transform-origin: 162px 173px; animation: wave 2.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .mascot-float, .mascot-shadow, .mascot-wave { animation: none; } }
  </style>
  <defs>
